name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: package
    strategy:
      matrix:
        os: [macos-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile
      # electron-builder 26 在并发上传多个产物时会重复创建 Release, 这里先建 draft,
      # 让所有上传都落到同一个 Release 上, 构建成功后再转正式发布
      - name: Resolve tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Release 说明取发版提交 (chore(release): x.y.z) 的正文,
            # app 更新弹窗会直接读取这段内容展示给用户
            NOTES="$(git log -1 --format=%b)"
            ARGS=(--draft --title "${TAG#v}")
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES" > release-notes.md
              ARGS+=(--notes-file release-notes.md)
            else
              ARGS+=(--generate-notes)
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              ARGS+=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${ARGS[@]}"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release $TAG 已正式发布, 重新发版请先删除该 Release 及其 tag"
            exit 1
          fi
      - name: Build
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.meta.outputs.tag }}" --draft=false
